window.TEUM_EXPERT = {"wood":{"sections":[{"title":"오행에서 목의 위치","body":"목은 봄과 같은 기운입니다. 언 땅을 뚫고 올라오는 새순처럼 위로, 바깥으로 뻗어 나가는 힘을 뜻합니다. 방향은 동쪽, 색은 푸른색에 해당하며, 몸에서는 간과 담, 근육과 눈과 깊이 이어집니다. 사주에 목이 넉넉한 사람은 성장 욕구가 크고, 어진 마음으로 주변을 품는 경향이 있습니다."},{"title":"목 부족이 일상에 미치는 영향","body":"목이 모자라면 새로운 일을 시작하는 힘이 약해집니다. 계획은 많아도 첫발을 떼기 어렵고, 한번 정한 생각을 쉽게 바꾸지 못해 답답함을 느끼기 쉽습니다. 몸에서는 눈의 피로, 뻣뻣한 어깨와 근육 긴장으로 드러나는 경우가 많고, 쉽게 짜증이 나거나 의욕이 꺾이기도 합니다."},{"title":"보완을 위한 전통적 처방","body":"동쪽으로 난 창을 자주 열고, 아침 햇빛 아래에서 걷는 시간을 만드는 것이 기본입니다. 푸른색과 초록 계열의 옷이나 소품, 살아 있는 식물을 곁에 두면 목의 기운이 들어옵니다. 신맛 나는 음식과 푸른 채소가 도움이 되며, 곧게 선 나무 소재의 가구나 길쭉한 화병도 같은 역할을 합니다."}]},"fire":{"sections":[{"title":"오행에서 화의 위치","body":"화는 여름과 같은 기운입니다. 따뜻한 햇살과 타오르는 불꽃처럼 빛과 온기를 퍼뜨리는 힘을 뜻합니다. 남쪽과 붉은빛에 해당하며, 몸에서는 심장과 혈액 순환, 혀와 깊이 연결됩니다. 사주에서 화가 풍부한 사람은 표현이 따뜻하고 사람을 끌어당기는 매력이 있습니다."},{"title":"화 부족이 일상에 미치는 영향","body":"화가 모자라면 마음에 불이 잘 붙지 않습니다. 하고 싶은 일이 있어도 의욕이 금세 식고, 사람을 만나는 일이 버겁게 느껴질 수 있습니다. 손발이 차고 혈색이 옅어지기 쉬우며, 겨울이나 흐린 날에 기분이 유난히 가라앉는 경향이 있습니다."},{"title":"보완을 위한 전통적 처방","body":"남쪽이 밝은 공간에서 지내고, 낮에 햇볕을 쬐는 시간을 늘리는 것이 좋습니다. 붉은색과 자주색 소품, 은은한 조명과 촛불이 화의 기운을 더합니다. 쓴맛이 나는 차와 따뜻한 음식을 가까이하고, 불을 거쳐 구워낸 도자기처럼 열의 흔적을 품은 물건을 곁에 두면 좋습니다."}]},"earth":{"sections":[{"title":"오행에서 토의 위치","body":"토는 계절과 계절 사이, 환절기의 기운입니다. 모든 것을 받아 주고 길러 내는 땅처럼 중심을 잡고 균형을 맞추는 힘을 뜻합니다. 방향은 중앙, 색은 황색에 해당하며, 몸에서는 위장과 비장, 입과 살에 이어집니다. 토가 넉넉한 사람은 믿음직하고 꾸준하며 사람 사이를 잘 잇습니다."},{"title":"토 부족이 일상에 미치는 영향","body":"토가 모자라면 마음이 한곳에 머물지 못합니다. 시작은 잘해도 끝까지 이어 가기 어렵고, 생활 리듬이 쉽게 흐트러집니다. 소화가 약하거나 식사가 불규칙해지기 쉬우며, 생각이 많아 걱정이 꼬리를 무는 일이 잦습니다."},{"title":"보완을 위한 전통적 처방","body":"정해진 시간에 식사하고 잠드는 규칙적인 생활이 가장 좋은 처방입니다. 황토색과 베이지 계열, 흙과 돌처럼 무게감 있는 소재를 가까이 두면 토의 기운이 쌓입니다. 단맛이 나는 곡물과 뿌리채소가 도움이 되며, 흙의 결이 살아 있는 그릇에 음식을 담아 먹는 것도 전통적인 방법입니다."}]},"metal":{"sections":[{"title":"오행에서 금의 위치","body":"금은 가을과 같은 기운입니다. 무르익은 열매를 거두고 필요 없는 것을 잘라 내듯, 맺고 끊고 다듬는 힘을 뜻합니다. 방향은 서쪽, 색은 흰색에 해당하며, 몸에서는 폐와 대장, 코와 피부에 이어집니다. 금이 넉넉한 사람은 판단이 분명하고 원칙과 의리를 중요하게 여깁니다."},{"title":"금 부족이 일상에 미치는 영향","body":"금이 모자라면 결정을 내리기 어렵습니다. 거절해야 할 때 거절하지 못하고, 물건과 일이 쌓여 주변이 쉽게 어수선해집니다. 호흡기와 피부가 예민해지기 쉽고, 마무리가 약해 애써 한 일의 결실을 놓치는 경우가 생깁니다."},{"title":"보완을 위한 전통적 처방","body":"공간을 비우고 정리하는 습관이 금을 채우는 첫걸음입니다. 흰색과 은색, 단단하고 매끄러운 금속이나 백자 같은 소재를 서쪽에 두면 좋습니다. 매운맛을 적당히 곁들이고, 깊은 호흡과 맑은 공기를 자주 들이는 것이 도움이 됩니다."}]},"water":{"sections":[{"title":"오행에서 수의 위치","body":"수는 겨울과 같은 기운입니다. 낮은 곳으로 흘러 깊이 고이는 물처럼 스며들고 저장하고 생각하는 힘을 뜻합니다. 방향은 북쪽, 색은 검은색에 해당하며, 몸에서는 신장과 방광, 귀와 뼈에 이어집니다. 수가 넉넉한 사람은 지혜롭고 유연하며 상황에 맞춰 흐를 줄 압니다."},{"title":"수 부족이 일상에 미치는 영향","body":"수가 모자라면 쉽게 지치고 회복이 더딥니다. 생각이 한쪽으로 치우치거나 조급해지기 쉽고, 마음을 가라앉히는 데 시간이 오래 걸립니다. 잠이 얕거나 몸이 쉽게 건조해지며, 허리와 무릎이 약해지는 경향이 있습니다."},{"title":"보완을 위한 전통적 처방","body":"충분한 수면과 물을 자주 마시는 습관이 기본입니다. 검은색과 남색 소품, 물을 담은 그릇이나 작은 수반을 북쪽 공간에 두면 수의 기운이 고입니다. 짠맛을 적당히 곁들이고 검은콩, 해조류 같은 음식을 가까이하는 것이 전통적인 처방입니다."}]}};
